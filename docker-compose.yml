services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zest
      POSTGRES_PASSWORD: zest
      POSTGRES_DB: zest_challenge
    ports:
      - "5432:5432"
    volumes:
      - zest_challenge_pgdata:/var/lib/postgresql/data

volumes:
  zest_challenge_pgdata:
